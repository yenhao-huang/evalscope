name: Native custom dataset contract
on:
  push:
    paths:
      - 'scripts/custom_datasets/**'
      - 'tests/custom_datasets/**'
      - '.github/workflows/custom-datasets.yml'
  pull_request:
    paths:
      - 'scripts/custom_datasets/**'
      - 'tests/custom_datasets/**'
      - '.github/workflows/custom-datasets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e . pytest ruff
      - run: .venv/bin/ruff check scripts/custom_datasets tests/custom_datasets
      - run: .venv/bin/pytest tests/custom_datasets -q
