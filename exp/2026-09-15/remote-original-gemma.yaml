services:
  gemma-4-26B-A4B-it:
    image: vllm/vllm-openai:gemma4-cu130
    networks:
      - vllm
    volumes:
      - /home/wingene/transformers_models/gemma-4-26B-A4B-it/:/workspace/llm_model
    deploy:
      resources:
        reservations:
          devices:
          - capabilities: ["gpu"]
            driver: nvidia
            device_ids: ["0"]
    environment:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      LLM_NAME: /workspace/llm_model
    command: >
      --dtype auto
      --quantization bitsandbytes
      --model /workspace/llm_model
      --max-model-len 8196
      --reasoning-parser gemma4
      --gpu-memory-utilization 0.4
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --max-num-seqs 2
      --trust-remote-code
      --enable-prefix-caching
      --kv_cache_dtype fp8
      --quantization fp8
    ports:
      - "3335:8000"
    restart: unless-stopped

networks:
  vllm:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.100.0/24
